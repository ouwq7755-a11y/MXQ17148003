<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#ec4899" />

    <title>美甲学院 - AI 美甲教学工具</title>

    <link rel="stylesheet" crossorigin href="/assets/index-BvBNQlCZ.css">
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- WeChat browser detection -->
    <div id="wechat-tip" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#FFFCFD;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;font-family:PingFang SC,sans-serif;">
      <div style="font-size:64px;margin-bottom:24px;">💅</div>
      <h2 style="font-size:20px;color:#222;font-weight:600;margin-bottom:8px;">美甲学院</h2>
      <p style="font-size:14px;color:#999;margin-bottom:24px;line-height:1.8;">微信内无法直接打开<br>请点击右上角 <b style="color:#F28FB2;">···</b> 选择<br><b style="color:#F28FB2;">「在浏览器中打开」</b></p>
      <div style="background:#FFE6EF;border-radius:16px;padding:16px 24px;max-width:280px;">
        <p style="font-size:12px;color:#F28FB2;margin:0;">📋 或复制链接到手机浏览器打开</p>
        <p id="wechat-url" style="font-size:11px;color:#999;margin:8px 0 0;word-break:break-all;"></p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isWechat = ua.indexOf('micromessenger') !== -1;
        if (isWechat) {
          document.getElementById('wechat-tip').style.display = 'flex';
          document.getElementById('wechat-url').textContent = window.location.href;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js');
        }
      })();
    </script>
  </body>
